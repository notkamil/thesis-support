[package]
name = "otterbrix-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# All bench binaries live in `src/bin/` and are picked up automatically
# by Cargo's auto-discovery, so no `[[bin]]` sections are needed here.

[lib]
path = "src/lib.rs"

[dependencies]
otterbrix-sys     = { path = "../../.workdir/repo/integration/rust/otterbrix-sys" }
otterbrix         = { path = "../../.workdir/repo/integration/rust/otterbrix" }
seaorm-otterbrix  = { path = "../../.workdir/repo/integration/rust/seaorm-otterbrix" }
sqlx-otterbrix    = { path = "../../.workdir/repo/integration/rust/sqlx-otterbrix" }

# Async runtime — required by sqlx-otterbrix and seaorm-otterbrix.
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }

# SeaORM and SQLx core directly, mirroring the way the adapter crates
# expose them. Versions match what the adapters depend on.
sea-orm      = { version = "1.1", features = ["proxy", "runtime-tokio-rustls"] }
sqlx-core    = { version = "=0.8.6", features = ["_rt-tokio"] }

# Deterministic data and parameter generation, identical between Rust
# and C++ benches via the ChaCha8 stream cipher.
rand         = "0.8"
rand_chacha  = "0.3"

tempfile     = "3"
